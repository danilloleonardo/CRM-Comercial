<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM Comercial</title>
<style>
:root{
  --bg:#F4F5F3;--panel:#FFFFFF;--ink:#182420;--sub:#5E6C66;--line:#DEE3DF;
  --accent:#2B6E52;--accent-ink:#E7F1EB;--warn:#B4552B;--warn-ink:#FBEBE2;
  --hi:#8A5A18;--hi-ink:#FBF0DE;--radius:10px;--font:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
h1{font-size:20px;margin:0 0 3px}
h2{font-size:16px;margin:0 0 14px}
.hidden{display:none !important}
/* login */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.loginbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:30px;width:100%;max-width:340px}
.loginbox h1{margin-bottom:4px}
.loginbox p{color:var(--sub);font-size:13px;margin:0 0 20px}
.loginbox .field{margin-bottom:12px}
.loginbox label{font-size:12px;color:var(--sub);font-weight:600;display:block;margin-bottom:5px}
.loginbox button{width:100%;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px;font-weight:600;margin-top:6px}
#loginError{color:var(--warn);font-size:12.5px;margin-top:10px;min-height:16px}
/* app shell */
.app{display:flex;min-height:100vh}
.side{width:210px;flex:0 0 210px;background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:20px}
.brand{font-weight:700;font-size:16px}
.brand span{color:var(--accent)}
.nav button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--sub);padding:9px 10px;border-radius:8px;font-size:13.5px;font-weight:500;margin-bottom:2px}
.nav button.active{background:var(--accent-ink);color:var(--accent);font-weight:600}
.nav button:hover:not(.active){background:var(--bg)}
.logout{margin-top:auto;background:none;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12.5px;color:var(--sub)}
.main{flex:1;min-width:0;padding:24px 28px 60px;overflow-x:auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 24px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat .n{font-size:22px;font-weight:700}
.stat .l{font-size:11.5px;color:var(--sub);margin-top:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.card .t{font-weight:600;font-size:14px}
.card .m{color:var(--sub);font-size:12.5px;margin-top:3px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;margin-right:5px}
.tag.hi{background:var(--hi-ink);color:var(--hi)}
.tag.over{background:var(--warn-ink);color:var(--warn)}
.section-title{font-size:14px;font-weight:700;margin:22px 0 10px}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
th{text-align:left;color:var(--sub);font-weight:600;font-size:11px;padding:9px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
tr.rowclick:hover td{background:var(--bg);cursor:pointer}
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-weight:600;font-size:13px}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--warn);border:1px solid var(--warn-ink)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--panel);border-radius:12px;width:100%;max-width:460px;max-height:88vh;overflow:auto;padding:22px}
.field{margin-bottom:11px}
.field label{font-size:12px;color:var(--sub);font-weight:600;display:block;margin-bottom:5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbtns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.quicklog textarea{min-height:70px}
.report{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;font-size:13px;line-height:1.6;margin-top:12px}
.empty{color:var(--sub);font-size:13px;padding:20px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius)}
@media(max-width:760px){.app{flex-direction:column}.side{width:100%;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line)}.nav{display:flex;gap:4px}.brand,.logout{display:none}.stats{grid-template-columns:1fr 1fr}.main{padding:16px}}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="loginbox">
    <h1>CRM Comercial</h1>
    <p>Entre com sua conta para acessar o painel.</p>
    <div class="field"><label>E-mail</label><input id="loginEmail" type="email" autocomplete="username"></div>
    <div class="field"><label>Senha</label><input id="loginPass" type="password" autocomplete="current-password"></div>
    <button id="loginBtn">Entrar</button>
    <div id="loginError"></div>
  </div>
</div>

<div class="app hidden" id="appShell">
  <div class="side">
    <div class="brand">CRM<span>Comercial</span></div>
    <div class="nav">
      <button data-view="dashboard" class="active">Painel</button>
      <button data-view="clients">Clientes</button>
      <button data-view="log">Registrar atividade</button>
      <button data-view="close">Fechar o dia</button>
    </div>
    <button class="logout" id="logoutBtn">Sair</button>
  </div>
  <div class="main" id="main"></div>
</div>

<div id="clientModalRoot"></div>

<script type="module">
// ====== FIREBASE CONFIG ======
// Substitua pelos dados reais do seu projeto (Firebase Console > Configurações do projeto > Seus apps > SDK).
// Esses valores identificam o projeto no client-side; a segurança fica a cargo das regras do Firestore/Auth, não do sigilo deste objeto.
const firebaseConfig = {
  apiKey: "COLE_AQUI_SUA_API_KEY",
  authDomain: "crm-comercial-danillo-leonardo.firebaseapp.com",
  projectId: "crm-comercial-danillo-leonardo",
  storageBucket: "crm-comercial-danillo-leonardo.appspot.com",
  messagingSenderId: "COLE_AQUI",
  appId: "COLE_AQUI"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const PRODUCTS = ["Mentor de Líderes","MBM","Treinamentos","Bônus"];
let uid = null, clients = [], activities = [], tasks = [], view = "dashboard";
let unsubClients=null, unsubAct=null, unsubTasks=null;

// ---------- AUTH ----------
document.getElementById("loginBtn").onclick = async () => {
  const email = document.getElementById("loginEmail").value.trim();
  const pass = document.getElementById("loginPass").value;
  const err = document.getElementById("loginError");
  err.textContent = "";
  try { await signInWithEmailAndPassword(auth, email, pass); }
  catch(e){ err.textContent = "Não foi possível entrar. Verifique e-mail e senha."; }
};
document.getElementById("logoutBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  if(user){
    uid = user.uid;
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("appShell").classList.remove("hidden");
    attachListeners();
  } else {
    uid = null;
    document.getElementById("loginScreen").classList.remove("hidden");
    document.getElementById("appShell").classList.add("hidden");
    if(unsubClients)unsubClients(); if(unsubAct)unsubAct(); if(unsubTasks)unsubTasks();
  }
});

function attachListeners(){
  unsubClients = onSnapshot(collection(db,"users",uid,"clients"), snap => {
    clients = snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  });
  unsubAct = onSnapshot(query(collection(db,"users",uid,"activities"), orderBy("createdAt","desc")), snap => {
    activities = snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  });
  unsubTasks = onSnapshot(collection(db,"users",uid,"tasks"), snap => {
    tasks = snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  });
}

// ---------- NAV ----------
document.querySelectorAll(".nav button").forEach(b=>{
  b.onclick = ()=>{ view=b.dataset.view; document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x===b)); render(); };
});

const todayStr = ()=> new Date().toISOString().slice(0,10);
const fmtBRL = n => (Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});

function render(){
  const main = document.getElementById("main");
  if(view==="dashboard") main.innerHTML = renderDashboard();
  else if(view==="clients") { main.innerHTML = renderClients(); bindClientRows(); }
  else if(view==="log") main.innerHTML = renderLog();
  else if(view==="close") main.innerHTML = renderClose();
  bindGlobalActions();
}

// ---------- DASHBOARD ----------
function renderDashboard(){
  const t = todayStr();
  const todayTasks = tasks.filter(x=>x.dueDate===t && !x.done);
  const overdue = tasks.filter(x=>x.dueDate<t && !x.done);
  const upcoming = tasks.filter(x=>x.dueDate>t && !x.done).sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0,8);
  const promised = clients.filter(c=>c.promisedDate && Number(c.balance||c.saleValue-c.paidValue)>0);
  const pendingTotal = clients.reduce((s,c)=>s+Math.max(0,(Number(c.saleValue)||0)-(Number(c.paidValue)||0)),0);
  const attention = clients.filter(c=>c.status==="Atenção" || (c.promisedDate && c.promisedDate<t));

  return `
  <h1>Painel</h1><p style="color:var(--sub);font-size:13px;margin:0 0 4px">${new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})}</p>
  <div class="stats">
    <div class="stat"><div class="n">${todayTasks.length}</div><div class="l">Tarefas hoje</div></div>
    <div class="stat"><div class="n">${overdue.length}</div><div class="l">Atrasadas</div></div>
    <div class="stat"><div class="n">${promised.length}</div><div class="l">Pagamentos prometidos</div></div>
    <div class="stat"><div class="n">${fmtBRL(pendingTotal)}</div><div class="l">Valor pendente total</div></div>
  </div>
  <div class="section-title">Tarefas de hoje e atrasadas</div>
  ${[...overdue,...todayTasks].length===0?'<div class="empty">Nada pendente para hoje.</div>':
    [...overdue,...todayTasks].map(x=>`
    <div class="card"><div class="t">${esc(x.title)} ${x.dueDate<t?'<span class="tag over">Atrasada</span>':''}</div>
    <div class="m">${esc(clientName(x.clientId))} · vence em ${x.dueDate}</div></div>`).join("")}
  <div class="section-title">Próximos follow-ups</div>
  ${upcoming.length===0?'<div class="empty">Nenhum follow-up futuro registrado.</div>':
    upcoming.map(x=>`<div class="card"><div class="t">${esc(x.title)}</div><div class="m">${esc(clientName(x.clientId))} · ${x.dueDate}</div></div>`).join("")}
  <div class="section-title">Clientes que precisam de atenção</div>
  ${attention.length===0?'<div class="empty">Nenhum cliente sinalizado no momento.</div>':
    attention.map(c=>`<div class="card"><div class="t">${esc(c.name)} <span class="tag hi">${esc(c.product||"")}</span></div>
    <div class="m">Saldo: ${fmtBRL((c.saleValue||0)-(c.paidValue||0))} ${c.promisedDate?'· prometido para '+c.promisedDate:''}</div></div>`).join("")}
  `;
}

// ---------- CLIENTS ----------
function renderClients(){
  return `
  <h1>Clientes</h1>
  <div class="toolbar" style="margin-top:14px"><button class="btn" id="newClientBtn">+ Novo cliente</button></div>
  ${clients.length===0?'<div class="empty">Nenhum cliente cadastrado ainda.</div>':`
  <table><thead><tr><th>Nome</th><th>Produto</th><th>Valor</th><th>Pago</th><th>Saldo</th><th>Status</th><th>Prometido</th></tr></thead>
  <tbody>${clients.map(c=>`
    <tr class="rowclick" data-id="${c.id}">
      <td>${esc(c.name)}</td><td>${esc(c.product||"")}</td><td>${fmtBRL(c.saleValue)}</td><td>${fmtBRL(c.paidValue)}</td>
      <td>${fmtBRL((c.saleValue||0)-(c.paidValue||0))}</td><td>${esc(c.status||"")}</td><td>${c.promisedDate||"—"}</td>
    </tr>`).join("")}</tbody></table>`}
  `;
}
function bindClientRows(){
  document.getElementById("newClientBtn")?.addEventListener("click", ()=>openClientModal(null));
  document.querySelectorAll("tr.rowclick").forEach(r=>{
    r.addEventListener("click", ()=>openClientModal(clients.find(c=>c.id===r.dataset.id)));
  });
}
function openClientModal(c){
  const root = document.getElementById("clientModalRoot");
  root.innerHTML = `
  <div class="overlay"><div class="modal">
    <h2>${c?"Editar cliente":"Novo cliente"}</h2>
    <div class="field"><label>Nome</label><input id="f_name" value="${c?esc(c.name):""}"></div>
    <div class="field"><label>Contato</label><input id="f_contact" value="${c?esc(c.contact||""):""}"></div>
    <div class="row2">
      <div class="field"><label>Produto</label><select id="f_product">${PRODUCTS.map(p=>`<option ${c&&c.product===p?"selected":""}>${p}</option>`).join("")}</select></div>
      <div class="field"><label>Status</label><select id="f_status">
        <option ${c&&c.status==="Ativo"?"selected":""}>Ativo</option>
        <option ${c&&c.status==="Atenção"?"selected":""}>Atenção</option>
        <option ${c&&c.status==="Concluído"?"selected":""}>Concluído</option>
      </select></div>
    </div>
    <div class="row2">
      <div class="field"><label>Valor da venda</label><input id="f_sale" type="number" step="0.01" value="${c?c.saleValue||0:0}"></div>
      <div class="field"><label>Valor pago</label><input id="f_paid" type="number" step="0.01" value="${c?c.paidValue||0:0}"></div>
    </div>
    <div class="field"><label>Data de pagamento prometida</label><input id="f_promised" type="date" value="${c?c.promisedDate||"":""}"></div>
    <div class="field"><label>Próximo passo</label><input id="f_next" value="${c?esc(c.nextStep||""):""}"></div>
    <div class="field"><label>Observações</label><textarea id="f_notes" rows="3">${c?esc(c.notes||""):""}</textarea></div>
    <div class="mbtns">
      <button class="btn" id="saveClientBtn">Salvar</button>
      ${c?'<button class="btn danger" id="delClientBtn">Excluir</button>':""}
      <button class="btn ghost" id="cancelClientBtn">Cancelar</button>
    </div>
  </div></div>`;
  document.getElementById("cancelClientBtn").onclick = ()=>root.innerHTML="";
  document.getElementById("saveClientBtn").onclick = async ()=>{
    const data = {
      name: document.getElementById("f_name").value.trim(),
      contact: document.getElementById("f_contact").value.trim(),
      product: document.getElementById("f_product").value,
      status: document.getElementById("f_status").value,
      saleValue: Number(document.getElementById("f_sale").value)||0,
      paidValue: Number(document.getElementById("f_paid").value)||0,
      promisedDate: document.getElementById("f_promised").value,
      nextStep: document.getElementById("f_next").value.trim(),
      notes: document.getElementById("f_notes").value.trim(),
    };
    if(!data.name) return;
    if(c) await updateDoc(doc(db,"users",uid,"clients",c.id), data);
    else await addDoc(collection(db,"users",uid,"clients"), data);
    root.innerHTML="";
  };
  if(c) document.getElementById("delClientBtn").onclick = async ()=>{
    await deleteDoc(doc(db,"users",uid,"clients",c.id));
    root.innerHTML="";
  };
}

// ---------- QUICK LOG ----------
function renderLog(){
  return `
  <h1>Registrar atividade</h1>
  <p style="color:var(--sub);font-size:13px">Descreva em linguagem natural o que aconteceu. Ex.: "João recebeu o material hoje e pediu para eu ligar sexta".</p>
  <div class="card quicklog" style="margin-top:14px">
    <div class="field"><label>Cliente</label><select id="log_client"><option value="">Sem cliente vinculado</option>${clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div>
    <div class="field"><label>O que aconteceu</label><textarea id="log_text" placeholder="Descreva a atividade..."></textarea></div>
    <div class="field"><label>Criar tarefa de follow-up? (opcional)</label><div class="row2"><input id="log_task" placeholder="Título da tarefa (ex.: Ligar para João)"><input id="log_date" type="date"></div></div>
    <button class="btn" id="logSaveBtn">Registrar</button>
  </div>`;
}
// Ponto de extensão: quando a chave do Gemini estiver configurada, esta função pode enviar
// log_text para a API e extrair automaticamente cliente/tarefa/data em vez dos campos manuais acima.
async function interpretWithGemini(text){ return null; }

function bindGlobalActions(){
  document.getElementById("logSaveBtn")?.addEventListener("click", async ()=>{
    const clientId = document.getElementById("log_client").value || null;
    const text = document.getElementById("log_text").value.trim();
    const taskTitle = document.getElementById("log_task").value.trim();
    const taskDate = document.getElementById("log_date").value;
    if(!text) return;
    await addDoc(collection(db,"users",uid,"activities"), { clientId, text, createdAt: new Date().toISOString(), date: todayStr() });
    if(taskTitle && taskDate){
      await addDoc(collection(db,"users",uid,"tasks"), { clientId, title: taskTitle, dueDate: taskDate, done:false, createdAt: new Date().toISOString() });
    }
    document.getElementById("log_text").value="";
    document.getElementById("log_task").value="";
    document.getElementById("log_date").value="";
  });
  document.getElementById("genReportBtn")?.addEventListener("click", ()=>{
    document.getElementById("reportBox").textContent = buildReport();
    document.getElementById("reportBox").classList.remove("hidden");
  });
  document.getElementById("copyReportBtn")?.addEventListener("click", ()=>{
    navigator.clipboard.writeText(document.getElementById("reportBox").textContent);
    const b=document.getElementById("copyReportBtn"); b.textContent="Copiado!"; setTimeout(()=>b.textContent="Copiar para WhatsApp",1500);
  });
}

// ---------- FECHAR O DIA ----------
function renderClose(){
  return `
  <h1>Fechar o dia</h1>
  <p style="color:var(--sub);font-size:13px">Gera um resumo pronto para colar no grupo do WhatsApp.</p>
  <button class="btn" id="genReportBtn" style="margin-top:14px">Gerar relatório do dia</button>
  <div class="report hidden" id="reportBox"></div>
  <button class="btn ghost hidden" id="copyReportBtn" style="margin-top:10px;display:inline-block">Copiar para WhatsApp</button>
  `;
}
function buildReport(){
  const t = todayStr();
  const todayAct = activities.filter(a=>a.date===t);
  const doneTasks = tasks.filter(x=>x.done && x.completedDate===t);
  const pendingTasks = tasks.filter(x=>!x.done && x.dueDate<=t);
  const promised = clients.filter(c=>c.promisedDate===t);
  let r = `*Fechamento do dia — ${new Date().toLocaleDateString("pt-BR")}*\n\n`;
  r += `Atividades registradas (${todayAct.length}):\n` + (todayAct.length? todayAct.map(a=>`• ${clientName(a.clientId)}: ${a.text}`).join("\n") : "• Nenhuma") + "\n\n";
  r += `Tarefas concluídas hoje (${doneTasks.length}):\n` + (doneTasks.length? doneTasks.map(x=>`• ${x.title} (${clientName(x.clientId)})`).join("\n") : "• Nenhuma") + "\n\n";
  r += `Pendências em aberto (${pendingTasks.length}):\n` + (pendingTasks.length? pendingTasks.map(x=>`• ${x.title} (${clientName(x.clientId)}) — vence ${x.dueDate}`).join("\n") : "• Nenhuma") + "\n\n";
  r += `Pagamentos prometidos para hoje (${promised.length}):\n` + (promised.length? promised.map(c=>`• ${c.name} — ${fmtBRL((c.saleValue||0)-(c.paidValue||0))}`).join("\n") : "• Nenhum");
  return r;
}

function clientName(id){ if(!id) return "Sem cliente"; const c=clients.find(x=>x.id===id); return c?c.name:"Cliente removido"; }
function esc(s){ return String(s??"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
</script>
</body>
</html>
